services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: myapp_db
      POSTGRES_USER: myapp_user
      POSTGRES_PASSWORD: nexthack-2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp_user -d myapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dummy-be:
    build: .
    container_name: dummy-be
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: myapp_db
      DB_USER: myapp_user
      DB_PASS: nexthack-2026
      JWT_SECRET: secret
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/root/logs
    restart: on-failure

volumes:
  postgres_data:
